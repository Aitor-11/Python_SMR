<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Layout</title>
<style>
#londres:target ~ section #display::before { content: "Londres"; }
#paris:target ~ section #display::before { content: "Paris"; }
#madrid:target ~ section #display::before { content: "Madrid"; }
#display::before { content: ""; }
</style>
</head>
<body>
<span id="londres"></span>
<span id="paris"></span>
<span id="madrid"></span>

<header style="text-align:center ; background-color:rgb(153, 148, 143) ; color :white ; padding :30px ;font-size :25px ">
<h1> cities </h1>
</header>
<section style="display: grid; grid-template-columns: 1fr 2fr 3fr; grid-template-rows: auto; gap: 30px; padding: 20px; background-color: rgb(161, 161, 161);">
<nav>
<ul>
<li><a href="#londres" target="cityframe">Londres</a></li>
<li><a href="#paris" target="cityframe">Paris</a></li>
<li><a href="#madrid" target="cityframe">Madrid</a></li>
</ul>
</nav>
<article style="grid-column: span 1; background-color: rgb(214, 214, 214); padding: 15px;">
<iframe name="cityframe" width="100%" height="500px" style="border: none;" ></iframe>
</article>
<article style="grid-column: span 1; background-color: rgb(214, 214, 214); padding: 15px;">
<iframe name="cityframe" width="100%" height="300px" style="border: none;" ></iframe>
<br>
<p id="display" style="font-size: 20px; font-weight: bold;"></p>
<label for="Alumno">Nombre:</label><br>
<input type="text" id="Nombre" name="Nombre"><br>
<label for="Correo">Correo:</label><br>
<br>
<input style="background-color: rgb(255, 255, 255)" id="Correo" type="text"><br><br>
<label for="Alumno">Description:</label>
<input type="text" style="font-size:35px" id="Nombre">
<br>
<input type="submit" value="Enviar">
</article>
</section>
<footer style="text-align:center ; background-color:rgb(153, 148, 143) ; color :white ; ">
<h1> footer</h1>
</footer>
</body>
</html>
